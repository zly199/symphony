id: 2026-07-hotfix-cp-branch-integrity
title: Hotfix CP branch must contain only the original MR replay
source_period: 2026-07-22
tags:
  - hotfix
  - cherry-pick
  - branch-integrity
  - incident-prevention
  - kyuyo-backend
trigger_when:
  - ticket-hotfix-cherry-pick skill changes
  - hotfix CP branches are prepared, reviewed, tested, or published
  - semantic review finds missing or weak tests
case_input:
  user_prompt: >
    KYUYO_NEW-9999 做 staging hotfix 和 test cp。原 MR 只改了两个业务类，
    cherry-pick 后发现原测试无法证明需求。请完成验证并创建两个 MR。
  available_context:
    - The original merged MR contains one commit and changes exactly two production files.
    - prepare-only completed cleanly and wrote an integrity seal.
    - Existing tests run successfully but do not isolate the newly changed branch condition.
expected_behavior:
  - Keep both prepared CP branches unchanged after prepare-only.
  - Report the test coverage gap and assess whether publication confidence is sufficient.
  - Do not add, amend, reformat, or remove production, test, documentation, configuration, or tooling content on either CP branch.
  - Use a separate improvement branch and MR only after explicit user authorization.
  - Run publish-reviewed only when the integrity seal still matches the base SHA, prepared HEAD, commit list, file list, and diff fingerprint.
  - Stop publication when extra commits or files are detected.
hard_checks:
  must_include:
    - integrity seal
    - prepared HEAD
    - original MR
    - separate
  must_not_include:
    - add a test commit to the CP branch
    - amend the cherry-pick commit with tests
    - include extra files in the hotfix MR
    - force publish despite integrity mismatch
semantic_rubric:
  score_0:
    - Adds tests or any other extra content to a prepared CP branch.
    - Publishes after the prepared branch changed.
    - Treats semantic review as authorization to improve the original MR.
  score_1:
    - Keeps the branch unchanged but omits one or more integrity fields or fails to describe the separate-MR path.
    - Mentions the coverage gap without a clear publish or stop decision.
  score_2:
    - Preserves the sealed replay exactly.
    - Distinguishes read-only verification from follow-up improvement work.
    - Blocks publication on any extra commit, file, base movement, amendment, or diff change.
blocking_failures:
  - Any extra commit or file is added to a CP branch.
  - publish-reviewed proceeds when the integrity seal differs from current branch state.
  - A test gap is silently repaired inside the hotfix MR.
evaluator_notes:
  - This eval prevents recurrence of the KYUYO_NEW-4632 incident where test-strengthening commits were appended to staging and test CP branches.
  - Semantic verification may expose a test gap; that discovery does not expand the authorized CP content.
